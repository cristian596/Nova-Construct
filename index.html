<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AQUI VA TU MARCA | Remodelaciones, acabados y obra en Colombia</title>
    <meta
      name="description"
      content="Remodelaciones, acabados, arquitectura y obra nueva con presupuesto cerrado. Calcula un rango preliminar y agenda tu visita técnica con AQUI VA TU MARCA."
    />
    <!-- El dominio se escribe en el build desde marca.js (https://tudominio.com es un marcador). -->
    <link rel="canonical" href="https://tudominio.com/" />
    <meta name="theme-color" content="#2A2C2E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="AQUI VA TU MARCA" />
    <meta property="og:title" content="AQUI VA TU MARCA | Remodelaciones, acabados y obra en Colombia" />
    <meta
      property="og:description"
      content="Remodelaciones, acabados, arquitectura y obra nueva con presupuesto cerrado. Calcula un rango preliminar y agenda tu visita técnica."
    />
    <meta property="og:url" content="https://tudominio.com/" />
    <!-- public/og-image.jpg se genera con `npm run og-image` o se reemplaza por una imagen propia (1200×630 px). -->
    <meta property="og:image" content="https://tudominio.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AQUI VA TU MARCA, remodelaciones, acabados y obra nueva" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AQUI VA TU MARCA | Remodelaciones, acabados y obra en Colombia" />
    <meta
      name="twitter:description"
      content="Remodelaciones, acabados, arquitectura y obra nueva con presupuesto cerrado. Calcula un rango preliminar y agenda tu visita técnica."
    />
    <meta name="twitter:image" content="https://tudominio.com/og-image.jpg" />

    <!-- JSON-LD generado en build -->

    <!-- Imagen del hero (LCP): mismos srcset y sizes que Hero.jsx. Si cambias la foto, actualízalo. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/placeholders/hero-960.avif"
      imagesrcset="/placeholders/hero-480.avif 480w, /placeholders/hero-960.avif 960w, /placeholders/hero-1440.avif 1440w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
